name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run tools/local_ci.py selftest
      - run: uv run --no-project python tools/conventions.py selftest
      - run: uv run --no-project python -m unittest discover -s tools -p "test_*.py"
      - run: pwsh -NoProfile -File tools/readme-test-selftest.ps1
