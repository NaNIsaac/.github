# Reusable: runs the marked setup steps of a repo's README on Linux, macOS and Windows.
# A repo calls it with:
#   jobs:
#     readme:
#       uses: NaNIsaac/.github/.github/workflows/readme.yml@main
# README.md and README.ko.md run on separate runners: both hold the same install blocks, and a second
# run on the same machine fails on what the first one installed ("already installed").
name: readme
on:
  workflow_call:

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      readmes: ${{ steps.list.outputs.readmes }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        shell: bash
        run: echo "readmes=$(ls README.md README.ko.md 2>/dev/null | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  steps:
    needs: find
    if: needs.find.outputs.readmes != '[]'
    # README.md keeps the job names it had before the split
    name: ${{ matrix.readme == 'README.md' && format('steps ({0})', matrix.os) || format('steps ({0}, {1})', matrix.os, matrix.readme) }}
    strategy:
      fail-fast: false
      matrix:
        readme: ${{ fromJSON(needs.find.outputs.readmes) }}
        # macOS minutes cost ten times as much on private repositories, so they only get Linux and Windows
        os: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/checkout@v7
        with:
          repository: NaNIsaac/.github
          path: .nanisaac
          sparse-checkout: tools
      - name: README setup steps
        shell: pwsh
        env:
          # Installers that call api.github.com (codigest install.sh) read this; anonymous requests hit the
          # per-IP rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
          README: ${{ matrix.readme }}
        run: ./.nanisaac/tools/readme-test.ps1 -Readme $env:README
