# Reusable: runs the marked setup steps of a repo's README on Linux and Windows (plus macOS on tags and workflow_dispatch).
# A repo calls it with:
#   jobs:
#     readme:
#       uses: NaNIsaac/.github/.github/workflows/readme.yml@main
# and, when its README installs from a private tendlane repository, `secrets: inherit` under `readme:`.
# README.md and README.ko.md run on separate runners: both hold the same install blocks, and a second
# run on the same machine fails on what the first one installed ("already installed").
name: readme
on:
  workflow_call:
    secrets:
      TENDLANE_READ_TOKEN:
        required: false

# A newer push replaces the run that is still going. The group has its own prefix: the calling
# workflow's group must not be the same string.
concurrency:
  group: readme-steps-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      readmes: ${{ steps.list.outputs.readmes }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        shell: bash
        run: echo "readmes=$(ls README.md README.ko.md 2>/dev/null | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  steps:
    needs: find
    if: needs.find.outputs.readmes != '[]'
    # README.md keeps the job names it had before the split
    name: ${{ matrix.readme == 'README.md' && format('steps ({0})', matrix.os) || format('steps ({0}, {1})', matrix.os, matrix.readme) }}
    strategy:
      fail-fast: false
      matrix:
        readme: ${{ fromJSON(needs.find.outputs.readmes) }}
        # Private repositories never run macOS (10x cost); public ones run it only on tags and workflow_dispatch
        os: ${{ fromJSON(!github.event.repository.private && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # A caller whose dependencies live in a private repository passes a read-only token with
      # `secrets: inherit`; without one (forks, public callers) git is left as it is.
      - name: Private dependencies
        shell: pwsh
        env:
          TENDLANE_READ_TOKEN: ${{ secrets.TENDLANE_READ_TOKEN }}
        run: |
          if ($env:TENDLANE_READ_TOKEN) {
            git config --global url."https://x-access-token:$($env:TENDLANE_READ_TOKEN)@github.com/tendlane/".insteadOf "https://github.com/tendlane/"
          }
      - uses: actions/checkout@v7
        with:
          repository: NaNIsaac/.github
          path: .nanisaac
          sparse-checkout: tools
      - name: README setup steps
        shell: pwsh
        env:
          # Installers that call api.github.com (codigest install.sh) read this; anonymous requests hit the
          # per-IP rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
          README: ${{ matrix.readme }}
        run: ./.nanisaac/tools/readme-test.ps1 -Readme $env:README

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # A caller whose dependencies live in a private repository passes a read-only token with
      # `secrets: inherit`; without one (forks, public callers) git is left as it is.
      - name: Private dependencies
        shell: pwsh
        env:
          TENDLANE_READ_TOKEN: ${{ secrets.TENDLANE_READ_TOKEN }}
        run: |
          if ($env:TENDLANE_READ_TOKEN) {
            git config --global url."https://x-access-token:$($env:TENDLANE_READ_TOKEN)@github.com/tendlane/".insteadOf "https://github.com/tendlane/"
          }
      - uses: actions/checkout@v7
        with:
          repository: NaNIsaac/.github
          path: .nanisaac
          sparse-checkout: tools
      - name: README overview synchronization
        run: uv run --no-project python .nanisaac/tools/conventions.py --check-overview .
      - name: Marked documentation examples
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.nanisaac/tools/readme-test.ps1 -Docs
