# Proves publish-gates.yml on the fixture package in tests/fixtures/gates_demo before any repo
# calls it: the gates build the fixture and pass all checks as a real repo's call does, the same
# clean build made in prep passes too, and builds with a credential file name, a
# key and a home-folder path planted at run time fail the leak check (expect-leak inverts that one
# job, so the run stays green only when each problem is caught).
# tag-version runs the install job's expected-version step for v and prefixed tags, a tag
# without the prefix (must fail) and a branch run. The path-* jobs check
# path-allowlist on the planted home folder: the folder itself passes, a prefix of it is another
# folder and fails, and an entry deeper than a home folder is refused. The allow-* jobs check leak-allow
# on a build with one key in gates_demo/patterns.py: the right entry and count pass it; no entry,
# an entry for another rule or the wrong count fail it; and an entry with nothing to match fails a
# clean build. Nothing
# key-shaped is stored in the repository: the planted keys are random and made in the prep job.
name: publish-gates-selftest
on:
  pull_request:
    paths:
      - .github/workflows/publish-gates*.yml
      - tests/fixtures/gates_demo/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-gates*.yml
      - tests/fixtures/gates_demo/**
  workflow_dispatch:

concurrency:
  group: publish-gates-selftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build --out-dir "$GITHUB_WORKSPACE/clean"
        working-directory: tests/fixtures/gates_demo
      - name: Build again with a key in a source file, for the leak-allow cases
        shell: python
        run: |
          import pathlib, secrets, string
          alphabet = string.ascii_letters + string.digits
          key = "ghp_" + "".join(secrets.choice(alphabet) for _ in range(36))
          pathlib.Path("tests/fixtures/gates_demo/src/gates_demo/patterns.py").write_text(f'SAMPLE = "{key}"\n')
      - run: uv build --out-dir "$GITHUB_WORKSPACE/allow"
        working-directory: tests/fixtures/gates_demo
      - name: Plant one problem per copy of the wheel
        shell: python
        run: |
          import pathlib, secrets, shutil, string, zipfile
          alphabet = string.ascii_letters + string.digits
          plants = {
              "name": ("gates_demo/.env", "DEMO=1\n"),
              "key": ("gates_demo/settings.py",
                      'TOKEN = "ghp_' + "".join(secrets.choice(alphabet) for _ in range(36)) + '"\n'),
              # the second form is how a README quotes it: in backticks, ending a sentence
              "path": ("gates_demo/where.txt",
                       "/" + "home/" + "builder/cache\nsee `/" + "home/" + "builder`.\n"),
          }
          for kind, (member, text) in plants.items():
              out = pathlib.Path(f"bad-{kind}")
              shutil.copytree("clean", out)
              wheel = next(out.glob("*.whl"))
              with zipfile.ZipFile(wheel, "a") as z:
                  z.writestr(member, text)
              print(f"bad-{kind}: added {member}")
      - uses: actions/upload-artifact@v7
        with:
          name: gates-clean
          path: clean/
      - uses: actions/upload-artifact@v7
        with:
          name: gates-bad-name
          path: bad-name/
      - uses: actions/upload-artifact@v7
        with:
          name: gates-bad-key
          path: bad-key/
      - uses: actions/upload-artifact@v7
        with:
          name: gates-bad-path
          path: bad-path/
      - uses: actions/upload-artifact@v7
        with:
          name: gates-allow
          path: allow/

  # The path a real repo takes: the gates build the fixture themselves and pass publish-gates-dist on.
  built:
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      smoke: python -m gates_demo

  clean:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-clean
      smoke: python -m gates_demo

  bad-name:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-name
      expect-leak: name

  bad-key:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-key
      expect-leak: key

  bad-path:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-path
      expect-leak: path

  # The expected-version step on its own, for tags a pull request run cannot have
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run the step for each ref
        shell: uv run --no-project --with pyyaml python {0}
        run: |
          import os, pathlib, subprocess, tempfile, yaml
          gates = yaml.safe_load(pathlib.Path(".github/workflows/publish-gates.yml").read_text(encoding="utf-8"))
          step = next(s for s in gates["jobs"]["install"]["steps"] if s.get("id") == "expected")
          # ref type, ref name, tag-prefix, the version the step must give (None: it must fail)
          cases = [
              ("tag", "v0.1.0", "v", "0.1.0"),
              ("tag", "gates-demo-v0.1.0", "gates-demo-v", "0.1.0"),
              ("tag", "gates-demo-v0.1.0", "v", None),
              ("tag", "v0.1.0", "gates-demo-v", None),
              ("branch", "main", "gates-demo-v", "0.1.0"),
          ]
          failed = 0
          for ref_type, ref_name, prefix, want in cases:
              out = pathlib.Path(tempfile.mkstemp()[1])
              env = {**os.environ, "GITHUB_REF_TYPE": ref_type, "GITHUB_REF_NAME": ref_name,
                     "TAG_PREFIX": prefix, "GITHUB_OUTPUT": str(out)}
              run = subprocess.run(["bash", "-e", "-c", step["run"]], cwd="tests/fixtures/gates_demo", env=env)
              got = out.read_text().partition("version=")[2].strip() if run.returncode == 0 else None
              failed += got != want
              print(f"{'ok' if got == want else 'FAIL'}: {ref_type} {ref_name}, tag-prefix {prefix}: {got}")
          if failed:
              raise SystemExit(f"{failed} case(s) gave the wrong version")

  path-allowed:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-path
      path-allowlist: /home/builder

  # A prefix of the planted folder is a different folder
  path-prefix:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-path
      path-allowlist: /home/build
      expect-leak: path

  path-not-folder:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-bad-path
      path-allowlist: /home/builder/cache
      expect-leak: allow

  allow-hit:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-allow
      leak-allow: "gates_demo/patterns.py: github-pat: 1"

  allow-missing:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-allow
      expect-leak: key

  allow-other-rule:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-allow
      leak-allow: "gates_demo/patterns.py: private-key: 1"
      expect-leak: key

  allow-stale:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-clean
      leak-allow: "gates_demo/patterns.py: github-pat: 1"
      expect-leak: allow

  allow-count:
    needs: prep
    uses: ./.github/workflows/publish-gates.yml
    with:
      import-name: gates_demo
      package-dir: tests/fixtures/gates_demo
      dist-artifact: gates-allow
      leak-allow: "gates_demo/patterns.py: github-pat: 2"
      expect-leak: allow
